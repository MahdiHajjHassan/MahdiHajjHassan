<title id="gcpTitle">An hourly cloud workflow from traffic batches to interpreted anomalies</title>
<desc id="gcpDesc">Documentation-only fictional traffic design, not a Thales system or pipeline run. An hourly schedule starts Workflows, ingestion feeds BigQuery staging, ODS, and warehouse layers, BigQuery ML illustrates anomaly scoring, Gemini illustrates interpretation, and Looker presents both. The chart has no measured data or model results.</desc>
