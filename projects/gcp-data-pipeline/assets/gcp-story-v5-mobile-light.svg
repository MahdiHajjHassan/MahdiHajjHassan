<title id="gcpTitle">An hourly cloud workflow from traffic batches to interpreted anomalies</title>
<desc id="gcpDesc">An hourly schedule starts Cloud Workflows and ingestion. Data moves through BigQuery staging, operational data store and warehouse layers into anomaly scoring. Gemini interprets the scored results, and Looker presents numerical scores and AI commentary separately.</desc>
